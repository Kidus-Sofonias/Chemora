[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chemengine"
version = "1.0.0"
description = "A production-grade chemistry engine with Molecular Graph as the single source of truth"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Kidus Sofonias", email = "kidus.sofonias@example.com" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.90.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pytest-cov>=4.1.0",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "pre-commit>=3.6.0",
]
viz = ["matplotlib>=3.8.0"]
ml = ["numpy>=1.26.0", "scipy>=1.12.0"]
all = ["chemengine[dev,viz,ml]"]

[project.entry-points."chemengine.plugins"]
# Built-in plugins register here; external packages can add their own

[tool.hatch.build.targets.wheel]
packages = ["src/chemengine"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "property: property-based tests using hypothesis",
    "benchmark: performance benchmark tests",
]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "D", "UP", "ANN", "SIM", "PT"]
ignore = ["ANN101", "ANN102"]
fix = true

[tool.ruff.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["chemengine"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*Protocol",
]
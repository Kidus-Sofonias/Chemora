_version = "1.0.0"

# Element-specific valence and charge limits.
# Used by the validation/sanitize module to verify molecular validity.

[default]
max_valence = 4
allowed_charges = [-2, -1, 0, 1, 2]
max_radical_electrons = 2
allow_double_bond = true
allow_triple_bond = false

[element.H]
max_valence = 1
allowed_charges = [0, 1]
max_radical_electrons = 1
allow_double_bond = false
allow_triple_bond = false

[element.C]
max_valence = 4
allowed_charges = [-1, 0, 1]
max_radical_electrons = 1
allow_double_bond = true
allow_triple_bond = true

[element.N]
max_valence = 5
allowed_charges = [-2, -1, 0, 1, 2, 3]
max_radical_electrons = 1
allow_double_bond = true
allow_triple_bond = true

[element.O]
max_valence = 2
allowed_charges = [-2, -1, 0, 1]
max_radical_electrons = 1
allow_double_bond = true
allow_triple_bond = false

[element.F]
max_valence = 1
allowed_charges = [-1, 0]
max_radical_electrons = 0
allow_double_bond = false
allow_triple_bond = false

[element.Si]
max_valence = 4
allowed_charges = [-1, 0, 1]
max_radical_electrons = 1
allow_double_bond = true
allow_triple_bond = false

[element.P]
max_valence = 5
allowed_charges = [-1, 0, 1, 2, 3]
max_radical_electrons = 1
allow_double_bond = true
allow_triple_bond = true

[element.S]
max_valence = 6
allowed_charges = [-2, -1, 0, 1, 2, 3, 4]
max_radical_electrons = 1
allow_double_bond = true
allow_triple_bond = true

[element.Cl]
max_valence = 1
allowed_charges = [-1, 0, 1, 3, 5, 7]
max_radical_electrons = 0
allow_double_bond = false
allow_triple_bond = false

[element.Br]
max_valence = 1
allowed_charges = [-1, 0, 1, 3, 5]
max_radical_electrons = 0
allow_double_bond = false
allow_triple_bond = false

[element.I]
max_valence = 1
allowed_charges = [-1, 0, 1, 3, 5, 7]
max_radical_electrons = 0
allow_double_bond = false
allow_triple_bond = false
name: Publish

# Publishes ChemEngine to PyPI when a version tag is pushed.
# Prerequisite (repository secret): PYPI_API_TOKEN — created from the
# maintainer's pypi.org account. The token is consumed by twine via an
# environment variable and is never printed or logged.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Build and publish ChemEngine
    runs-on: ubuntu-latest
    permissions:
      # Standard contents permission; publishing uses the API token secret.
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        working-directory: packages/chemengine
        run: python -m build

      - name: Twine check
        working-directory: packages/chemengine
        run: python -m twine check dist/*

      - name: Upload to PyPI
        working-directory: packages/chemengine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/chemengine/dist/*
